name: Build Emby Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'  # 使用 .NET 8 SDK，通常能兼容 netstandard2.0 目标
    - name: Restore dependencies
      run: dotnet restore src/Emby.ActorBrowser/Emby.ActorBrowser.csproj
    - name: Build
      run: dotnet build src/Emby.ActorBrowser/Emby.ActorBrowser.csproj -c Release --no-restore
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Emby.ActorBrowser
        path: src/Emby.ActorBrowser/bin/Release/netstandard2.0/Emby.ActorBrowser.dll
